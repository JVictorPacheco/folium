services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: folium
      POSTGRES_PASSWORD: folium
      POSTGRES_DB: folium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folium"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://folium:folium@db:5432/folium
      JWT_SECRET_KEY: dev-secret-change-me
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-Folium <no-reply@folium.app>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
